name: Verify desktop installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: true
        type: string
      previous_version:
        description: Explicit source version (0.1.0 settings/two-step, 0.1.1-2 dialog/two-step, 0.1.3-9 automatic, 0.1.10-17 prefetch)
        required: true
        type: string
      source_commit:
        description: Frozen build commit
        required: true
        type: string
      installer_sha256:
        description: Expected installer SHA-256
        required: true
        type: string
      mode:
        description: Draft candidate or published online upgrade
        required: true
        default: candidate
        type: choice
        options: [candidate, online]
      transfer_expectation:
        description: Differential required by default; full-fallback is a separately reported diagnostic scenario
        required: true
        default: differential
        type: choice
        options: [differential, full-fallback]

permissions:
  contents: read

concurrency:
  group: desktop-acceptance-${{ github.ref }}-${{ inputs.version }}-${{ inputs.previous_version }}-${{ inputs.mode }}-${{ inputs.transfer_expectation }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    # GitHub 仅向有推送权限的身份提供草稿 Release；脚本仍只读取附件，不调用发布接口。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check acceptance process lifecycle before installing
        run: pnpm exec vitest run tests/desktop-acceptance-process.test.mjs tests/desktop-acceptance-process-integration.test.mjs tests/desktop-acceptance-windows.test.mjs tests/desktop-inspector-connection.test.mjs tests/desktop-acceptance-inputs.test.mjs tests/desktop-update-network-evidence.test.mjs --reporter=default --reporter=json --outputFile=test-results/acceptance-preflight.json
      - name: Install and verify the exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CBIM_ACCEPTANCE_VERSION: ${{ inputs.version }}
          CBIM_ACCEPTANCE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          CBIM_ACCEPTANCE_COMMIT: ${{ inputs.source_commit }}
          CBIM_ACCEPTANCE_SHA256: ${{ inputs.installer_sha256 }}
          CBIM_ACCEPTANCE_MODE: ${{ inputs.mode }}
          CBIM_ACCEPTANCE_TRANSFER: ${{ inputs.transfer_expectation }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node scripts/desktop-release-acceptance.mjs
      - name: Preserve actual installation and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.version }}-${{ inputs.mode }}
          path: |
            test-results/acceptance-preflight.json
            test-results/desktop-acceptance/*.json
            test-results/desktop-acceptance/*.png
          if-no-files-found: ignore
