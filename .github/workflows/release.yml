name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish CLI
        run: dotnet publish src/AgenticCLI/AgenticCLI.csproj --configuration Release --output publish

      - name: Create release archive
        id: archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="cbim-${TAG}.tar.gz"
          tar -czf "$ARCHIVE" -C publish .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          ZH_NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.zh-CN.md)
          {
            echo 'notes<<EOF'
            echo '## English'
            echo
            echo "$NOTES"
            echo
            echo '---'
            echo
            echo '## 中文'
            echo
            echo "$ZH_NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE=$(git log -1 --pretty=%s "$TAG")
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "${{ steps.notes.outputs.notes }}" \
            "${{ steps.archive.outputs.archive }}"
