name: Tests

on:
  pull_request:
  push:
    branches: [master]

# Coverage:
#   Runs the v1 kernel test suite under v1/tests/, excluding the `workflow`
#   marker (end-to-end loop tests that require ANTHROPIC_API_KEY + the
#   `claude` CLI and are opt-in / auto-skipped without those).
#
#   Dependencies pulled in by tests:
#     - pytest                         (test runner; declared in requirements-dev.txt)
#     - mcp >= 1.0.0                   (kernel runtime; declared in v1/kernel/requirements.txt)
#
#   v1/tests/conftest.py prepends v1/kernel/ to sys.path, so no editable
#   install is required. Smoke phase scripts (smoke_phase*.py) are kept in
#   the suite — they're regular pytest modules despite the name.
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r v1/kernel/requirements.txt

      - name: Run pytest (excluding workflow opt-in tests)
        env:
          CBIM_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p .cbim
          python -m pytest v1/tests/ -m "not workflow" -q

  # ---------------------------------------------------------------------------
  # Lint job — Batch 0 baseline-anchor.
  #
  # Runs ruff + mypy against the kernel. Pre-existing violations are
  # tolerated (--exit-zero / continue-on-error) so this job never blocks
  # the matrix while we're still measuring the baseline; later batches
  # ratchet the failure threshold down.
  #
  # The intent is informational right now — every PR gets a violation
  # count delta in its log, even if the count itself is non-zero.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r v1/kernel/requirements.txt

      # --exit-zero keeps both steps green while we're anchoring the baseline.
      # Annotations + statistics are split because ruff rejects
      # `--statistics` combined with `--output-format=github` (format
      # validation crashes before --exit-zero can swallow it).
      - name: ruff check (annotations on PR diff)
        run: |
          ruff check v1/kernel --output-format=github --exit-zero

      - name: ruff check (statistics for baseline tracking)
        run: |
          ruff check v1/kernel --statistics --exit-zero

      - name: ruff format --check (baseline — informational)
        continue-on-error: true
        run: |
          ruff format --check v1/kernel

      - name: mypy (baseline — informational)
        continue-on-error: true
        run: |
          mypy v1/kernel
