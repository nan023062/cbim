name: Tests

on:
  pull_request:
  push:
    branches: [master, v2-development]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/cbim.sln

      - name: Build
        run: dotnet build src/cbim.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/cbim.sln --no-build --configuration Release --verbosity normal
