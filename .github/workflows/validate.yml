name: Validate CBIM

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      scope:
        description: Full validation or focused Windows runtime diagnosis
        required: true
        default: full
        type: choice
        options: [full, runtime-diagnostic]

permissions:
  contents: read

concurrency:
  # PR 中间提交互相取代；手动诊断不能取消同分支正在运行的完整检查。
  group: cbim-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'pull-request' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select checks from changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      website: ${{ steps.scope.outputs.website }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - id: scope
        env:
          CBIM_CI_SCOPE: ${{ inputs.scope }}
        run: node scripts/ci-scope.mjs

  deferred:
    name: Draft PR - release validation not run
    needs: scope
    if: needs.scope.outputs.mode == 'deferred'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain how to start full validation
        run: echo 'Draft PR only. Mark ready for review to run the exact head/base checks; workflow_dispatch full remains available.' >> "$GITHUB_STEP_SUMMARY"

  # 公共检查只执行一次，与测试分片并行，不成为每片的重复前置步骤。
  static:
    name: Shared static checks
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'diagnostic'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Check architecture and dependencies
        run: pnpm check:architecture
      - name: Check module test ownership and isolation
        run: pnpm check:test-modules
      - name: Build website and verify brand once
        if: needs.scope.outputs.website != 'true'
        env:
          CBIM_WEBSITE_URL: https://nan023062.github.io/cbim/
        run: pnpm build:website
      - name: Check affected website in a browser
        if: needs.scope.outputs.website == 'true'
        env:
          CBIM_WEBSITE_URL: https://nan023062.github.io/cbim/
        run: node scripts/ci-website-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.website == 'true'
        with:
          name: website-validation
          path: test-results/branding-website
          if-no-files-found: error

  windows:
    name: ${{ needs.scope.outputs.mode == 'diagnostic' && 'Windows runtime diagnosis' || format('Windows validation ({0}/4)', matrix.shard) }}
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'diagnostic'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 从 Vitest 实际发现的全集按耗时分配；新增测试不会因缺历史数据被遗漏。
        shard: ${{ fromJSON(needs.scope.outputs.mode == 'diagnostic' && '[1]' || '[1,2,3,4]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - name: Check installed Electron file identities
        run: |
          @'
          const fs = require('node:fs'), path = require('node:path');
          const executable = fs.realpathSync(require('electron'));
          const files = [executable, ...['icudtl.dat', 'v8_context_snapshot.bin', 'snapshot_blob.bin'].map(name => path.join(path.dirname(executable), name)).filter(file => fs.existsSync(file))];
          for (const file of files) {
            const stat = fs.lstatSync(file);
            console.log(JSON.stringify({file, isFile: stat.isFile(), nlink: stat.nlink, size: stat.size}));
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1) throw Error('Electron test runtime must use independent regular files');
          }
          '@ | node
      - name: Check canonical test temporary directory
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os'); const temp=os.tmpdir(); if(temp!==fs.realpathSync(temp)) throw Error('Test temporary directory is not canonical'); fs.mkdirSync('test-results',{recursive:true}); console.log('Canonical test temporary directory: '+temp);"
      - name: Run full test suite
        if: needs.scope.outputs.mode == 'full'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=test-results/pr-full-suite.json
      - name: Diagnose Windows runtime without changing assertions
        if: needs.scope.outputs.mode == 'diagnostic'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec vitest run tests/scoped-execution-pi.test.ts tests/terminal.test.ts --reporter=default --reporter=json --outputFile=test-results/runtime-diagnostic.json
      - name: Preserve test report and discovered coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ matrix.shard }}
          path: |
            test-results/pr-full-suite.json
            test-results/ci-shard-plan-*.json
            test-results/runtime-diagnostic.json
            test-results/isolation-recovery-pi-failure.json
            test-results/isolation-recovery-crash-failure.json
            test-results/terminal-state.json
          if-no-files-found: error

  light:
    name: Documentation and website checks
    needs: scope
    if: needs.scope.outputs.mode == 'docs' || needs.scope.outputs.mode == 'website'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Check changed text and added local links
        env:
          CBIM_CI_BASE: ${{ needs.scope.outputs.base }}
          CBIM_CI_HEAD: ${{ needs.scope.outputs.head }}
        run: node scripts/ci-light-check.mjs
      - uses: ./.github/actions/setup-ci
        if: needs.scope.outputs.mode == 'website'
      - name: Build and check 14 website scenes
        if: needs.scope.outputs.mode == 'website'
        env:
          CBIM_WEBSITE_URL: https://nan023062.github.io/cbim/
        run: node scripts/ci-website-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.mode == 'website'
        with:
          name: website-validation
          path: test-results/branding-website
          if-no-files-found: error

  result:
    name: ${{ needs.scope.outputs.mode == 'diagnostic' && 'CBIM diagnostic result' || 'CBIM validation' }}
    needs: [scope, static, windows, light]
    if: always() && needs.scope.outputs.mode != 'deferred'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Reject failed or unexpectedly skipped checks
        env:
          CBIM_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.mode == 'full'
        with:
          pattern: windows-validation-*
          path: ci-reports
      - name: Verify complete test coverage across all four shards
        if: needs.scope.outputs.mode == 'full'
        run: node scripts/ci-test-coverage.mjs ci-reports
