.logo-frame,.default-logo{display:inline-grid;vertical-align:middle;width:20px;height:20px;color:var(--text)}.logo-frame>*{grid-area:1/1;object-fit:contain}.default-logo[hidden]{display:none}.default-logo svg{width:20px;height:20px}#exec-dialog [hidden]{display:none}

<header class="top"><b class="brand">CBIM</b><span class="separator"></span>客户端项目<span class="end">扩展面板</span></header>
<div class="desktop"><div class="office">Office 对话</div><main class="panel" id="panel">
<nav class="tabs" aria-label="扩展标签"><button class="tab" id="business"></button><button class="tab" id="organization"></button><span class="end"></span><button class="icon sizebtn" id="size"></button><button class="icon" id="theme"></button></nav>
<div class="frame"><header class="heading"><h1></h1><small id="summary"></small></header>
<div class="layout"><aside><div class="navhead"><h3 id="navtitle"></h3><button id="toggle-all" aria-controls="tree"><span id="all-arrow" aria-hidden="true"></span><span id="all-label" aria-hidden="true"><span id="all-expand">全部展开</span><span id="all-collapse">全部收起</span></span></button></div>
<label class="search"><span id="searchicon"></span><input type="search" id="search"></label><nav aria-labelledby="navtitle" class="tree" id="tree"></nav></aside><article aria-label="节点详情" id="detail"></article></div>
<footer class="foot"><span>CBIM 客户端</span><span class="end">本地示例项目</span></footer></div></main></div>
<dialog id="skill-dialog" aria-labelledby="skill-title"><form id="skill-form">
<small id="skill-role"></small><h2 id="skill-title"></h2><p id="skill-warning"></p>
<div id="skill-fields"><div id="skill-logo-editor"></div><label>技能名称<input id="skill-name" required maxlength="100" autocomplete="off"></label>
<label>用途与执行说明<textarea id="skill-content" rows="5" required maxlength="32000" placeholder="说明何时使用，以及这个岗位应执行哪些步骤"></textarea></label></div>
<p id="skill-error" role="alert"></p><div class="dialog-actions"><button type="button" id="skill-cancel">取消</button><button id="skill-submit">保存</button></div></form></dialog>
<dialog id="flow-dialog" aria-labelledby="flow-title"><form id="flow-form">
<small id="flow-node"></small><h2 id="flow-title">配置本节点工作流</h2><div id="flow-logo-editor"></div><div id="flow-steps"></div>
<button type="button" id="flow-add">＋ 新增步骤</button><p role="alert" id="flow-error"></p>
<div class="dialog-actions"><button type="button" id="flow-cancel">取消</button><button id="flow-submit">保存工作流</button></div></form></dialog>
<dialog id="output-dialog" aria-labelledby="output-title"><form id="output-form"><small id="output-node"></small><h2 id="output-title"></h2><p id="output-prompt"></p>
<div id="output-fields"><label>产出物名称<input id="output-name" maxlength="160" required></label><label>说明<textarea id="output-description" rows="2" required></textarea></label>
<label>路径或交付形式（可选）<input id="output-path"></label><label>交付标准（每行一条）<textarea id="output-criteria" rows="4" placeholder="填写可逐条核验的条件"></textarea></label></div>
<p role="alert" id="output-error"></p><div class="dialog-actions"><button type="button" id="output-cancel">取消</button><button id="output-submit">保存</button></div></form></dialog>
<dialog id="exec-dialog" aria-labelledby="exec-title"><form id="exec-form"><small id="exec-role"></small><h2 id="exec-title">岗位执行配置</h2>
<fieldset><legend>执行引擎</legend><details id="engine-picker"><summary id="engine-value"></summary><div id="engine-options"></div></details></fieldset>
<fieldset><legend>模型</legend><details id="model-picker"><summary id="model-value"></summary><div id="model-options"></div></details></fieldset>
<fieldset><legend>连接器</legend><div id="connector-selected"></div><div id="connector-picker" hidden></div></fieldset><p role="alert" id="exec-error"></p>
<div class="dialog-actions"><button type="button" id="exec-cancel">取消</button><button id="exec-save">保存</button></div></form></dialog>
<script>
const icons={"workflow":"<rect x=\"3\" y=\"3\" width=\"6\" height=\"6\" rx=\"1\" /><rect x=\"15\" y=\"15\" width=\"6\" height=\"6\" rx=\"1\" /><path d=\"M9 6h9v9M15 12l3 3 3-3M6 9v12h5\" />","folder":"<path d=\"M3 6V4h6l3 3h9v13H3ZM3 10h18\" />","terminal":"<rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"2\" /><path d=\"m6 8 4 4-4 4M13 16h5\" />","person":"<circle cx=\"12\" cy=\"7\" r=\"4\" /><path d=\"M4 21v-3a8 8 0 0 1 16 0v3\" />","team":"<circle cx=\"9\" cy=\"7\" r=\"3\" /><path d=\"M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3\" />","search":"<circle cx=\"10\" cy=\"10\" r=\"7\" /><path d=\"m15 15 6 6\" />","chevron":"<path d=\"m9 5 7 7-7 7\" />","expand":"<path d=\"m7 8 5-5 5 5M7 16l5 5 5-5M4 12h16\" />","collapse":"<path d=\"m7 3 5 5 5-5M7 21l5-5 5 5M4 12h16\" />","code":"<path d=\"m8 5-6 7 6 7M16 5l6 7-6 7M14 3l-4 18\" />","back":"<path d=\"m10 5-7 7 7 7M3 12h18\" />","sun":"<circle cx=\"12\" cy=\"12\" r=\"4\" /><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1\" />","moon":"<path d=\"M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z\" />","panelRight":"<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"3\" /><path d=\"M15 4v16\" />"};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+icons[name]+'</svg>';
const $=id=>document.getElementById(id);
function tool(id,label,glyph){const b=$(id);b.title=label;b.setAttribute('aria-label',label);b.innerHTML=icon(glyph)}
const business=[
 ['client','CBIM 客户端',null,'workflow','组织客户端的资源交付与执行引擎能力。','product','src/logic/','客户端业务逻辑'],
 ['market','资源商城','client','folder','维护资源的发现、分发与安装流程，让项目成员可以找到并使用所需资源。','curator','src/logic/resource-management/','资源目录、安装与本地登记'],
 ['catalog','资源目录','market','folder','汇集可用资源，维护资源索引及本地登记信息。','curator','src/logic/resource-management/local-registry.ts','本地资源索引'],
 ['install','资源安装','market','folder','管理资源安装记录，向项目提供可用的扩展能力。','installer','src/logic/resource-management/plugin-installations.ts','插件安装记录'],
 ['engines','引擎管理','client','terminal','维护执行引擎目录及模型选择，供项目配置执行环境。','operator','src/logic/engines/','引擎目录与配置'],
 ['choices','模型选择','engines','folder','维护可用模型及其与执行引擎的对应关系。','operator','src/logic/engines/catalog/','模型与引擎映射']
];
const organization=[
 ['project','项目组',null,'team','统筹客户端各团队的设计与交付。'],
 ['product','项目协调岗','project','person','协调资源与引擎团队的交付计划。','需求梳理','任务分派'],
 ['resources','资源团队','project','team','负责资源商城目录维护、安装流程与交付验收。'],
 ['curator','资源维护岗','resources','person','维护商城目录与来源范围，审核资源说明，协同安装维护岗完成交付。','目录维护','资源审核'],
 ['installer','安装维护岗','resources','person','验证资源安装流程，维护本地安装记录。','安装验证','记录维护'],
 ['runtime','引擎团队','project','team','负责执行引擎及模型配置。'],
 ['operator','引擎维护岗','runtime','person','维护引擎目录、模型选择及运行配置。','引擎检查','模型配置']
];
const data={business,organization}, names={business:'业务架构',organization:'组织架构'};
let page=location.hash==='#organization'?'organization':'business', origin=null;
function initial(id,open){return {id,open:new Set(open),query:'',detail:false,trail:[]}}
const states={business:initial('market',['client','market','engines']),organization:initial('curator',['project','resources','runtime'])};
const s=()=>states[page], nodes=()=>data[page], find=id=>nodes().find(n=>n[0]===id), children=id=>nodes().filter(n=>n[2]===id);
const parents=id=>{const chain=[];let n=find(id);while(n){chain.unshift(n);n=find(n[2])}return chain};
function narrow(){return $('panel').clientWidth<=690}
function focus(id){const el=$(id);if(el && el.getClientRects().length)el.focus();else $('search').focus()}
function tree(){
 const term=s().query.trim().toLowerCase(), visible=new Set();
 for(const n of nodes())if(n.slice(0,5).filter((_,i)=>[0,1,4].includes(i)).join(' ').toLowerCase().includes(term))parents(n[0]).forEach(p=>visible.add(p[0]));
 function branch(id){return children(id).filter(n=>visible.has(n[0])).map(([key,name])=>{
 const kids=children(key).length>0, open=term||s().open.has(key), glyph=find(key)[3];
 const toggle=kids?'<button class="toggle" id="toggle-'+key+'" data-toggle="'+key+'" title="'+(open?'收起 ':'展开 ')+name+'" aria-label="'+(open?'收起 ':'展开 ')+name+'" aria-expanded="'+Boolean(open)+'" '+(term?'disabled':'')+'>'+icon('chevron')+'</button>':'<span class="indent"></span>';
 return '<li><div class="node '+(s().id===key?'current':'')+'">'+toggle+'<button class="pick" id="node-'+key+'" data-pick="'+key+'" aria-current="'+(s().id===key)+'">'+icon(glyph)+name+'</button></div>'+(kids&&open?'<ul>'+branch(key)+'</ul>':'')+'</li>'
 }).join('')}
 $('tree').innerHTML=visible.size?'<ul>'+branch(null)+'</ul>':'<p class="empty" role="status">没有匹配的节点。</p>';
 const branches=new Set(nodes().map(n=>n[2]).filter(Boolean));
 const allOpen=branches.size>0 && [...branches].every(id=>s().open.has(id));
 const action=allOpen?'collapse':'expand';
 const allButton=$('toggle-all');
 const label=allOpen?'全部收起':'全部展开';
 allButton.setAttribute('aria-label',label);
 allButton.title=label;
 allButton.dataset.action=action;
 allButton.disabled=!!term || !branches.size;
 if(term)allButton.title='搜索时自动展开匹配路径';
}
function section(title,body,count){return '<section class="section"><h3>'+title+(count===undefined?'':'<span class="count">'+count+'</span>')+'</h3>'+body+'</section>'}
function linkrow(n){return '<button id="link-'+n[0]+'" class="row" data-link="'+n[0]+'">'+icon(n[3])+n[1]+'<span class="end">'+icon('chevron')+'</span></button>'}
const book='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 6C9 4 6 4 2 5v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1Zm0 0v14"/></svg>';
function objectLogo(kind,logo){
 const fallback='<span class="default-logo" aria-hidden="true">'+(kind==='skill'?book:icon('workflow'))+'</span>';
 return /^data:image\/(png|jpeg|webp);base64,[a-z0-9+/]+=*$/i.test(logo||'')?'<span class="logo-frame">'+fallback+'<img width="20" height="20" alt="" style="visibility:hidden" src="'+logo+'" onload="finishLogo(this)" onerror="this.remove()"></span>':fallback;
}
async function finishLogo(img){try{await img.decode();if(img.isConnected){img.previousElementSibling.hidden=true;img.style.visibility='visible'}}catch{img.remove()}}
function logoEditor(kind,draft){
 const area=$(kind==='skill'?'skill-logo-editor':'flow-logo-editor');
 const draw=()=>{area.innerHTML='<div>'+objectLogo(kind,draft.logo)+' <label>自定义 Logo<input type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button">恢复默认图标</button><small role="status"></small></div>';
 const input=area.querySelector('input');
 input.onchange=async()=>{const file=input.files[0];if(!file)return;
 if(file.size>96*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){area.querySelector('small').textContent='请选择 96 KiB 以内的 PNG、JPEG 或 WebP。';return}
 const reader=new FileReader();reader.onload=()=>{if(!area.contains(input))return;draft.logo=String(reader.result);draw()};reader.readAsDataURL(file)};
 area.querySelector('button').onclick=()=>{delete draft.logo;draw();area.querySelector('input').focus()};};draw();
}

function skillKey(role){return 'cbim.architecture-preview.skills.v1.'+role}
function roleSkills(role){
 try{
   const stored=localStorage.getItem(skillKey(role));

function safeText(value){const span=document.createElement('span');span.textContent=value;return span.innerHTML}

let skillDraft;

function closeSkill(target){

$('skill-cancel').onclick=()=>closeSkill(skillDraft.trigger);
$('skill-dialog').oncancel=e=>{e.preventDefault();closeSkill(skillDraft.trigger)};
$('skill-form').onsubmit=e=>{
 e.preventDefault();
 const {mode,role,id}=skillDraft,skills=roleSkills(role).slice();
 let index=skills.findIndex(x=>x.id===id);
 if(mode!=='add'&&index<0){$('skill-error').textContent='该技能已被移除，请取消并重新选择。';return}
 if(mode==='remove')skills.splice(index,1);
 else{
   const name=$('skill-name').value.trim(),content=$('skill-content').value.trim();
   if(!name||!content){$('skill-error').textContent='请填写技能名称和执行说明。';return}
   if(skills.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){$('skill-error').textContent='当前节点已有同名技能。';$('skill-name').focus();return}
   if(mode==='add'&&skills.length>=32){$('skill-error').textContent='当前节点已配置 32 项技能。';return}
   if(mode==='add')index=skills.length;
   skills[index]={id:id||crypto.randomUUID(),name,content,...(skillDraft.logo&&{logo:skillDraft.logo})};
 }
 try{localStorage.setItem(skillKey(role),JSON.stringify(skills))}
 catch{$('skill-error').textContent='浏览器未能保存本地示例，请检查存储权限后重试。';return}
 closeSkill(mode==='remove'?'skill-add':'skill-edit-'+index);
};
const flowKey=id=>'cbim.architecture-preview.workflow.v1.'+id;
function readSteps(id){
 try{const saved=localStorage.getItem(flowKey(id));if(saved!==null){const value=JSON.parse(saved);return Array.isArray(value)?value:value.steps}}catch{}
 return id==='market'?[{name:'核对资源来源',owner:'resources'},{name:'审核目录条目',owner:'curator'}]:[];
}
function flowLogo(id){try{return JSON.parse(localStorage.getItem(flowKey(id)))?.logo}catch{return undefined}}
function flowSection(id){
 const steps=readSteps(id);
 const rows=steps.map((step,i)=>'<div class="row step-summary"><span class="count">'+(i+1)+'</span><span>'+safeText(step.name)+'</span><small>'+organization.find(n=>n[0]===step.owner)[1]+'</small></div>').join('');
 return '<section class="section" id="workflow"><div class="skill-head"><h3>'+objectLogo('workflow',flowLogo(id))+' 本节点工作流<span class="count">'+steps.length+'</span></h3><button id="flow-edit">配置步骤</button></div><small>归属 · '+find(id)[1]+'</small>'+(rows?'<div class="listbox">'+rows+'</div>':'<p class="empty">本节点尚未配置步骤。</p>')+'</section>';
}
let flowDraft;
function drawSteps(){
 const options=organization.map(n=>'<option value="'+n[0]+'">'+(n[3]==='team'?'团队':'岗位')+' · '+n[1]+'</option>').join('');
 $('flow-steps').innerHTML=flowDraft.steps.map((step,i)=>'<fieldset class="step-edit" data-step="'+i+'"><legend>步骤 '+(i+1)+'</legend><label>步骤名称<input required maxlength="100" data-field="name"></label><label>负责团队或岗位<select data-field="owner">'+options+'</select></label><button type="button" data-move="-1" '+(i===0?'disabled':'')+'>上移</button><button type="button" data-move="1" '+(i===flowDraft.steps.length-1?'disabled':'')+'>下移</button><button type="button" data-remove>移除</button></fieldset>').join('');
 [...$('flow-steps').children].forEach((row,i)=>{for(const field of row.querySelectorAll('[data-field]'))field.value=flowDraft.steps[i][field.dataset.field]});
}
$('flow-steps').oninput=e=>{if(e.target.dataset.field)flowDraft.steps[e.target.closest('fieldset').dataset.step][e.target.dataset.field]=e.target.value};
$('flow-steps').onclick=e=>{
 const button=e.target.closest('button');if(!button)return;
 const steps=flowDraft.steps,i=Number(button.closest('fieldset').dataset.step);
 let target=i;
 if(button.hasAttribute('data-remove'))steps.splice(i,1);
 else{target=i+Number(button.dataset.move);[steps[i],steps[target]]=[steps[target],steps[i]]}
 drawSteps();($('flow-steps').children[Math.min(target,steps.length-1)]?.querySelector('input')||$('flow-add')).focus();
};
$('flow-add').onclick=()=>{flowDraft.steps.push({name:'',owner:find(flowDraft.node)[5]});drawSteps();$('flow-steps').lastElementChild.querySelector('input').focus()};

$('flow-form').onsubmit=e=>{

 if(steps.some(step=>!step.name)){$('flow-error').textContent='请为每个步骤填写名称。';return}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-connectors')){
   if(!$('exec-dialog').open)$('exec-edit').click();
   $('connector-picker').hidden=false;
   $('connector-picker').querySelector('input:enabled').focus();
   return;
 }
 if(b.dataset.skill){openSkill(b);return}
 if(b.dataset.output){openOutput(b);return}
 const {pick,link,toggle}=b.dataset;
 if(pick||link){select(pick||link,b.id);return}
 if(toggle){if(s().open.has(toggle))s().open.delete(toggle);else s().open.add(toggle);tree();focus(b.id);return}
 if(b.id in names){page=b.id;origin=null;render();focus(page);return}
 switch(b.id){
 case 'exec-edit':execDraft=execution(s().id);$('exec-role').textContent=find(s().id)[1];$('exec-error').textContent='';$('engine-picker').open=$('model-picker').open=false;$('connector-picker').hidden=true;drawExecution();$('exec-dialog').showModal();break;
 case 'flow-edit':flowDraft={node:s().id,steps:readSteps(s().id),logo:flowLogo(s().id)};logoEditor('workflow',flowDraft);$('flow-node').textContent='业务节点 · '+find(s().id)[1];$('flow-error').textContent='';drawSteps();$('flow-dialog').showModal();break;
 case 'owner':{origin={id:s().id};const owner=find(s().id)[5];page='organization';s().id=owner;s().detail=true;s().query='';s().trail=[];parents(owner).forEach(x=>s().open.add(x[0]));render();focus('detailtitle');break}
 case 'returnbiz':returnBiz();break;
 case 'tolist':list();break;
 case 'size':document.body.classList.toggle('compact');render();break;
 case 'theme':document.documentElement.classList.toggle('dark');render();break;
 case 'toggle-all':
   if(b.dataset.action==='collapse')s().open.clear();
   else s().open=new Set(nodes().map(n=>n[2]).filter(Boolean));
   tree();
   break;
 }
});
$('search').oninput=e=>{s().query=e.target.value;tree()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')){if(document.activeElement===$('search')&&s().query){s().query=$('search').value='';tree()}else back();e.preventDefault()}});
$('all-arrow').innerHTML=icon('chevron');$('searchicon').innerHTML=icon('search');
document.documentElement.classList.toggle('dark',matchMedia('(prefers-color-scheme:dark)').matches);render();
</script></html>
