<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CBIM · Agent 工具调用 UX 原型</title><style>:root{--canvas:#f7f8fa;--panel:#fff;--subtle:#eceef2;--text:#20242c;--muted:#596270;--line:#d8dde5;--focus:#2459bc;--danger:#b13737;--success:#246642;color-scheme:light;font:15px/1.65 system-ui,sans-serif;background:var(--canvas);color:var(--text)}:root[data-theme=dark]{--canvas:#17191d;--panel:#202329;--subtle:#2a2e36;--text:#f0f2f5;--muted:#adb5c2;--line:#414854;--focus:#9bbdff;--danger:#ffaaaa;--success:#88d0a2;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,select,textarea,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%;min-height:44px}button,summary{cursor:pointer}button:hover{background:var(--subtle)}:focus-visible{outline:2px solid var(--focus);outline-offset:3px}a{color:var(--focus)}header{border-bottom:1px solid var(--line);padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}main{max-width:860px;margin:auto;padding:24px 16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted,small{color:var(--muted)}h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}p{margin:10px 0}.message{margin:24px 0}.user{padding:16px;background:var(--subtle);border-radius:10px}.tool{border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}.tool button{margin-top:8px}.status{display:inline-flex;gap:8px;align-items:center}.danger{color:var(--danger)}.success{color:var(--success)}.composer{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:24px;background:var(--panel)}textarea{width:100%;min-height:100px;resize:vertical}.ui-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}button .ui-icon{margin-right:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.tile{border:1px solid var(--line);padding:12px;overflow-wrap:anywhere}code{overflow-wrap:anywhere}dialog{width:min(860px,100%);max-width:100%;max-height:95dvh;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#0006}details{margin:16px 0}summary{min-height:44px;display:flex;align-items:center}details[open]>div,dialog[open]{animation:enter .16s ease-out}@keyframes enter{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}:root[data-reduced=true] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:600px){dialog{margin:0;inset:0;width:100%;height:100dvh;max-height:100dvh;border-radius:0;padding:16px}.tool{padding:12px}main{padding:16px}}</style></head><body>
<header><strong>CBIM · 统一 Agent 对话</strong><label>预览状态 <select id="state"><option value="running">执行中</option><option value="done">已完成</option><option value="depth">深度超限</option><option value="concurrency">并发超限</option><option value="budget">预算超限</option><option value="question">等待答复</option><option value="stopping">停止中</option><option value="unknown">结果待核实</option></select></label><button id="theme" title="切换原型浅色或深色外观">切换主题</button><label><input id="reduced" type="checkbox">减少动效</label></header>
<main><p class="muted">设计演示 · 所有数据和动作均为本地示例，不连接模型、项目或账号。</p><h1>修复断线重连</h1><p>主 Agent · <span id="status" role="status"></span></p><div class="message user">用户：修复断线重连问题，并验证恢复后的对局状态。</div><div class="message"><strong>主 Agent</strong><p>我会检查当前恢复逻辑，再验证对局状态。先调用联机 Agent。</p></div><div id="toolArea"></div><p id="reply"></p><div id="extra"></div><section class="composer"><label for="input">发送给主 Agent</label><textarea id="input" placeholder="补充要求或提出下一步指令…"></textarea><div class="row"><button id="send">添加演示输入</button><small>执行 Agent 只接受调用方 Agent 指令</small></div><p id="feedback" role="status"></p></section><details id="icons-view"><summary>图标与风格目录</summary><div><p>所有工具使用同一状态与操作图标；身份不授予权限。</p><div id="icons" class="grid"></div></div></details><p><a href="cbim-complete-ux-prototype.html">查看全部管理界面设计</a></p></main>
<dialog id="detail" aria-labelledby="detailTitle"><div class="row"><h2 id="detailTitle" tabindex="-1">工具调用详情</h2><button id="back">返回调用方</button><button id="close">关闭详情</button></div><div id="detailBody"></div></dialog><script>const UI_ICONS={

 list:['任务列表','navigation','<rect x="3" y="4" width="4" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><path d="M11 6h10M11 12h10M11 18h10"/>'],

 palette:['风格规范','navigation','<path d="M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 1-4c-2-1-1-3 1-3h2a3 3 0 0 0 3-3 9 9 0 0 0-9-8Z"/><circle cx="7" cy="11" r=".6"/><circle cx="10" cy="7" r=".6"/><circle cx="15" cy="7" r=".6"/>'],
 goal:['目标确认','navigation','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
 handoff:['交接物','navigation','<path d="M5 3h10l4 4v14H5ZM15 3v5h4M8 14h8M13 11l3 3-3 3"/>'],
 knowledge:['知识与记录','navigation','<path d="M12 5Q7 2 3 4v16q4-2 9 1 5-3 9-1V4q-4-2-9 1ZM12 5v16M6 8l3 1M15 9l3-1"/>'],
 info:['说明 / 操作帮助','navigation','<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.2"/>'],
 person:['用户 / 成员','role','<circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/>'],
 coordinator:['协调岗位','role','<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 8v5M5 17v-4h14v4"/>'],
 design:['设计岗位','role','<path d="m4 16 12-12 4 4L8 20H4ZM13 7l4 4M4 5h5M6 3v5"/>'],

const $=id=>document.getElementById(id);
function uiIcon(name){return '<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">'+UI_ICONS[name][2]+'</svg>'}
const samples={running:['执行中','正在检查重连状态与测试用例。','running'],done:['已完成','已修复重连逻辑，并返回改动与测试依据。','success'],depth:['失败 · 未启动','递归深度超过上限：当前 2，请求深度 3，上限 2。无执行副作用。','failed'],concurrency:['失败 · 未启动','并发已达上限：当前 3 / 3，本次需要 1 个执行名额。无执行副作用。','failed'],budget:['失败 · 未启动','预算不足：已消耗 ¥8.20，本次预留 ¥2.00，上限 ¥10.00。无执行副作用。','failed'],question:['等待调用方答复','测试 Agent 请求确认断线后是否保留未发送操作；由联机 Agent 处理，需要用户决定时主 Agent 再提问。','queued'],stopping:['停止中','停止请求已传递，测试进程仍在退出；已修改的文件保留。','stopping'],unknown:['结果待核实','连接中断，尚未确认测试结果。只查询原调用，不重新执行。','unknown']};
let selected='running',stack=[],entry=null;
function state(){return samples[selected]}
function card(name,next){const s=state();return '<section class="tool"><div class="status '+(['depth','concurrency','budget'].includes(selected)?'danger':'')+'">'+uiIcon(s[2])+'<b>调用 '+name+'</b> · '+s[0]+'</div><p>'+s[1]+'</p><button data-open="'+next+'" aria-haspopup="dialog">'+uiIcon('inspect')+'查看调用详情</button></section>'}
function thread(who){if(who==='test')return '<h2>测试 Agent · 执行对话</h2><p class="muted">只读 · 指令来自联机 Agent · 结果返回联机 Agent</p><div class="message user">联机 Agent：验证会话重连后的状态恢复。</div><div class="message">测试 Agent：我先运行相关测试。</div><section class="tool"><b>'+uiIcon('terminal')+'执行测试命令</b><p>'+state()[1]+'</p></section><p>测试结果返回联机 Agent，由它决定修改或汇总。</p>';
return '<h2>联机 Agent · 执行对话</h2><p class="muted">只读 · 指令来自主 Agent · 结果返回主 Agent</p><div class="message user">主 Agent：检查并修复断线重连，返回变更与验证依据。</div><p>联机 Agent：已定位会话恢复逻辑，将调用测试 Agent 验证。</p>'+card('测试 Agent','test')+'<p>收到工具结果后继续判断，再向主 Agent反馈。</p>'}
function detail(who){const s=state();const rejected=['depth','concurrency','budget'].includes(selected);$('detailBody').innerHTML='<p class="muted">示例数据 · 不代表真实执行</p><div class="status">'+uiIcon(s[2])+s[0]+'</div><details><summary>输入与执行约束</summary><div><p>输入：检查断线重连并返回验证依据</p><p>深度：'+(who==='test'?'2':'1')+' / 2 · 活动执行：3 / 3 · 预算：¥8.20 / ¥10.00</p><p>数值仅作演示；限制由可信宿主判定。</p></div></details>'+(rejected?'<h2>调用未启动</h2><p class="danger">'+s[1]+'</p><p>错误返回直接调用方。没有创建空执行对话。</p>':thread(who));$('back').hidden=stack.length<2;$('detail').scrollTop=stack.at(-1)?.scroll||0}
function open(who,button){if(!$('detail').open){entry=button;stack=[];$('detail').showModal()}else if(stack.length)stack.at(-1).scroll=$('detail').scrollTop;stack.push({who,scroll:0});detail(who);$('detailTitle').focus()}
function render(){const s=state();$('toolArea').innerHTML=card('联机 Agent','network');$('reply').textContent=selected==='done'?'主 Agent：已核对返回的变更与验证范围。以下是本次交付摘要（示例）。':'主 Agent 根据工具结果继续判断；工具完成不等于整个任务完成。';$('status').textContent=s[0]}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(b.dataset.open,b)});
$('back').onclick=()=>{stack.pop();detail(stack.at(-1).who);$('detailTitle').focus()};$('close').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>{stack=[];entry?.focus()});
$('state').onchange=()=>{selected=$('state').value;render();if($('detail').open)detail(stack.at(-1).who)};
$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
$('reduced').onchange=()=>document.documentElement.dataset.reduced=String($('reduced').checked);
$('send').onclick=()=>{const text=$('input').value.trim();if(!text){$('input').focus();return}const node=document.createElement('div');node.className='message user';node.textContent='用户（本地演示）：'+text;$('extra').append(node);$('input').value='';$('feedback').textContent='演示输入已添加到主对话；未调用模型或发送消息。'};
$('icons').innerHTML=Object.entries(UI_ICONS).map(([name,[label]])=>'<div class="tile">'+uiIcon(name)+' '+label+'<br><code>'+name+'</code></div>').join('');render();
function revealAnchor(){if(location.hash==='#icons'||location.hash==='#icons-view')document.getElementById('icons-view').open=true}revealAnchor();window.addEventListener('hashchange',revealAnchor);
</script></body></html>
